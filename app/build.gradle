plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tscanner.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.tscanner.app"
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName "1.2.5"

        buildConfigField "String", "BILLING_VERIFIER_URL", "\"${project.findProperty('BILLING_VERIFIER_URL') ?: ''}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        resourceConfigurations += ['en', 'vi', 'es', 'pt', 'fr', 'in', 'id', 'de', 'ja']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    aaptOptions {
        noCompress 'traineddata'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // AndroidX CameraX (Chụp siêu tốc, Zero Shutter Lag, Lấy nét liên tục)
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google Play Services ML Kit Document Scanner
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // Google Play Services Code Scanner & ML Kit Barcode Scanning (QR Code)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    // Google Play Services ML Kit Text Recognition (Unbundled models: Latin, Trung, Nhật, Hàn, Hindi - hỗ trợ 16 KB page size)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1'

    // Google ML Kit Language Identification (Bundled on-device model cho phân tích đoạn/ngôn ngữ - Gói O03)
    implementation 'com.google.mlkit:language-id:17.0.6'

    // Tesseract OCR for Vietnamese (hỗ trợ 16 KB page size)
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'

    // Image loading & EXIF
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Google Play In-App Updates & Billing
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // Modern Google Sign-In via AndroidX Credential Manager & Google ID
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // OkHttp 4 for Google Drive REST API v3
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // AndroidX WorkManager for background cloud backup
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
